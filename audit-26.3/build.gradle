plugins { id 'net.fabricmc.fabric-loom' }
version = '0.1.0-alpha.2'

base { archivesName = 'rubidium-audit-dev-only-26.3' }

dependencies {
    implementation project(':minecraft-26.3')
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.3'
}

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
tasks.withType(JavaCompile).configureEach { options.release = 25 }

loom {
    runs {
        server {
            runDir 'run-server-26.3-audit-v2'
            programArg 'nogui'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
