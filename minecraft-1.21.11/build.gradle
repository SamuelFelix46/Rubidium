plugins { id 'fabric-loom' }

base { archivesName = 'rubidium-flow-1.21.11' }

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.18.4'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.140.2+1.21.11'

    implementation project(':common')
    include project(':common')

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
    runs {
        server { runDir 'run-server-1.21.11'; programArg 'nogui' }
        client { runDir 'run-client-1.21.11' }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
